<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superbet</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201a;--mu:#6b7a72;--bd:#e1e7e3;--g:#0a8f3c;--g2:#e6f5ea;--r:#d33;--y:#f5b301;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mu:#8fa297;--bd:#263229;--g2:#16301f}}
:root[data-theme=dark]{--bg:#0e1512;--card:#17211c;--tx:#e8f0ec;--mu:#8fa297;--bd:#263229;--g2:#16301f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--g);letter-spacing:-.5px;cursor:pointer}.logo b{color:var(--y)}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border:0;color:var(--mu);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--g2);color:var(--g);font-weight:600}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.o{background:none;color:var(--g);border:1px solid var(--g)}.btn.w{width:100%}
.bal{background:var(--g2);color:var(--g);padding:7px 12px;border-radius:8px;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.m{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.m small{color:var(--mu)}
.odds{display:flex;gap:6px;margin-top:8px}.odds button{flex:1;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 2px;font:inherit;cursor:pointer}
.odds button span{display:block;font-size:11px;color:var(--mu)}.odds button.on{background:var(--g);color:#fff;border-color:var(--g)}.odds button.on span{color:#d7f5e0}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.mu{color:var(--mu)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}.won{background:var(--g2);color:var(--g)}.lost{background:#fde7e7;color:var(--r)}.open{background:#fff3cd;color:#8a6500}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.stats .card{margin:0}.stats h3{margin:0;font-size:22px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(380px,92vw);padding:18px}dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.full{grid-column:1/-1}.warn{font-size:12px;color:var(--mu);text-align:center;padding:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;cursor:pointer;transition:.2s}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.cr{width:34px;height:34px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}
#hero{max-width:1100px;margin:14px auto 0;padding:0 14px}.hs{position:relative;height:210px;border-radius:16px;overflow:hidden}
.sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#fff;opacity:0;transform:translateX(60px);transition:opacity .8s,transform .8s;pointer-events:none}.sl.on{opacity:1;transform:none;pointer-events:auto}
.sl h2{margin:4px 0;font-size:clamp(22px,4vw,34px)}.sl p{margin:0 0 12px;opacity:.85}.sl small{letter-spacing:2px;color:var(--y);font-weight:700}.sl .btn{background:var(--y);color:#111}
.sl svg,.bn svg{height:92%;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:9px;background:#fff6;transition:.3s}.dots i.on{width:22px;background:#fff}
.bn{display:flex;justify-content:space-between;align-items:center;height:130px;border-radius:14px;padding:0 20px;color:#fff;margin-bottom:12px;overflow:hidden}.bn h2{margin:0}.bn p{margin:4px 0 0;opacity:.85}.bn svg{height:110%;margin-top:14px}
.an{animation:up .5s ease}@keyframes up{from{opacity:0;transform:translateY(14px)}}
</style></head><body>
<header id="hd"></header><div id="hero"></div><main id="app"></main><div id="toast"></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),money=n=>'GHS '+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),now=()=>new Date().toLocaleString();
const LEAGUES={'Premier League':['Arsenal','Man City','Liverpool','Chelsea','Tottenham','Man United','Newcastle','Aston Villa'],'La Liga':['Real Madrid','Barcelona','Atletico Madrid','Sevilla','Real Sociedad','Villarreal','Athletic Club','Valencia'],'Serie A':['Inter','AC Milan','Juventus','Napoli','Roma','Lazio','Atalanta','Fiorentina'],'Bundesliga':['Bayern Munich','Dortmund','Leverkusen','RB Leipzig','Stuttgart','Frankfurt','Freiburg','Wolfsburg'],'Ligue 1':['PSG','Marseille','Monaco','Lyon','Lille','Nice','Lens','Rennes'],'Ghana Premier League':['Asante Kotoko','Hearts of Oak','Medeama','Aduana Stars','Bibiani Gold Stars','Dreams FC','Berekum Chelsea','Samartex']};
let db;try{db=JSON.parse(localStorage.superbet)}catch(x){}
db=db||{users:[],deposits:[],bets:[],matches:[],uid:null,seq:1};
const save=()=>{try{localStorage.superbet=JSON.stringify(db)}catch(x){}};
const DUR=30000;
function plan(m,d){const x=Math.random()*100,[a,b]=m.p;let h,aw;if(x<a){h=R(1,4);aw=R(0,h-1)}else if(x<a+b){h=aw=R(0,3)}else{aw=R(1,4);h=R(0,aw-1)}
 m.res={h,a:aw};m.ev=[...Array(h).fill('h'),...Array(aw).fill('a')].map(s=>({s,t:R(1,90)})).sort((p,q)=>p.t-q.t);m.ko=Date.now()+d;m.end=m.ko+DUR}
function addOne(lg,d){const t=[...LEAGUES[lg]].sort(()=>Math.random()-.5);let a=R(20,60),b=R(15,30),c=100-a-b;if(c<10){c=10;a-=10}
 const f=p=>+(0.92/(p/100)).toFixed(2),o=+(1.6+Math.random()*.7).toFixed(2),m={id:db.seq++,h:t[0],a:t[1],odds:{'1':f(a),X:f(b),'2':f(c),O:o,U:+(1/(1.08-1/o)).toFixed(2)},p:[a,b,c],done:false,lg};plan(m,d);db.matches.push(m)}
function cdText(m){const n=Date.now();if(m.done)return 'FT '+m.res.h+'-'+m.res.a;if(n<m.ko){const s=Math.ceil((m.ko-n)/1000);return 'Starts in '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 const t=Math.min(90,Math.max(1,Math.floor((n-m.ko)/DUR*90)));return 'LIVE '+t+"' "+m.ev.filter(x=>x.s==='h'&&x.t<=t).length+'-'+m.ev.filter(x=>x.s==='a'&&x.t<=t).length}
function tick(){const n=Date.now();let ch=false;
 db.matches.forEach(m=>{if(!m.done&&n>=m.end){m.done=true;ch=true}if(!m.done&&n>=m.ko&&!m.lv){m.lv=1;ch=true}});
 db.bets.filter(b=>b.status==='open'&&b.legs.every(l=>{const m=db.matches.find(m=>m.id===l.mid);return m&&m.done})).forEach(b=>{
  const ok=b.legs.every(l=>won(l,db.matches.find(m=>m.id===l.mid).res));b.status=ok?'won':'lost';const u=db.users.find(u=>u.id===b.uid);
  if(ok&&u)u.bal=+(u.bal+b.ret).toFixed(2);if(u&&u.id===db.uid)toast(ok?'🎉 Bet '+b.id+' WON! +'+money(b.ret):'Bet '+b.id+' lost');ch=true});
 for(const lg in LEAGUES){const c=db.matches.filter(m=>!m.done&&m.lg===lg&&m.ko>n).length;for(let i=c;i<8;i++){addOne(lg,R(40,150)*1000);ch=true}}
 const used=new Set(db.bets.flatMap(b=>b.legs.map(l=>l.mid))),old=db.matches.filter(m=>m.done&&!used.has(m.id));
 if(old.length>60){const rm=new Set(old.slice(0,old.length-40).map(m=>m.id));db.matches=db.matches.filter(m=>!rm.has(m.id))}
 const k=slip.length;slip=slip.filter(s=>{const m=db.matches.find(m=>m.id===s.mid);return m&&!m.done&&n<m.ko});if(slip.length!==k)ch=true;
 if(ch){save();if(tab!=='deposit'&&location.hash!=='#admin')render()}
 document.querySelectorAll('.cd').forEach(el=>{const m=db.matches.find(m=>m.id==el.dataset.id);if(m)el.textContent=cdText(m)})}
function resultsV(){const L=db.matches.filter(m=>m.done&&m.lg).sort((x,y)=>y.end-x.end).slice(0,30);return L.length?L.map(m=>`<div class="card"><div class="m"><div style="display:flex;align-items:center;gap:10px">${crest(m.h)}<div style="flex:1"><b>${e(m.h)}</b> vs <b>${e(m.a)}</b><br><small class="mu">${m.lg}</small></div>${crest(m.a)}</div><b style="font-size:20px">${m.res.h} : ${m.res.a}</b></div></div>`).join(''):'<div class="card">No results yet – virtual matches finish within a minute or two.</div>'}
db.matches.filter(m=>!m.done&&!m.ev).forEach(m=>plan(m,R(8,60)*1000));
for(const lg in LEAGUES){const c=db.matches.filter(m=>!m.done&&m.lg===lg&&m.ko>Date.now()).length;for(let i=c;i<8;i++)addOne(lg,R(8,200)*1000)}save();
let tab='matches',slip=[],adminTab='overview',flt='All';
const user=()=>db.users.find(u=>u.id===db.uid),isAdmin=()=>sessionStorage.sbadm==='1';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const LBL={'1':'Home','X':'Draw','2':'Away',O:'Over 2.5',U:'Under 2.5'};

/* ---------- BET LOGIC ---------- */
function toggle(mid,pick){const m=db.matches.find(x=>x.id==mid),i=slip.findIndex(s=>s.mid==mid);
 if(i>-1&&slip[i].pick===pick)slip.splice(i,1);else{if(i>-1)slip.splice(i,1);slip.push({mid:m.id,pick,odds:m.odds[pick],name:m.h+' vs '+m.a})}render()}
const totalOdds=()=>+slip.reduce((a,s)=>a*s.odds,1).toFixed(2);
function placeBet(){const u=user();if(!u)return openAuth('login');const st=+$('#stake').value;
 if(!slip.length)return toast('Add a selection first');if(!(st>=1))return toast('Minimum stake is GHS 1');if(slip.some(s=>{const m=db.matches.find(m=>m.id===s.mid);return !m||Date.now()>=m.ko}))return toast('A match has kicked off – remove it from your slip');if(st>u.bal)return toast('Insufficient balance – please deposit');
 u.bal=+(u.bal-st).toFixed(2);const od=totalOdds();
 db.bets.unshift({id:'SB-'+Math.random().toString(36).slice(2,8).toUpperCase(),uid:u.id,legs:slip.map(s=>({...s})),stake:st,odds:od,ret:+(st*od).toFixed(2),status:'open',at:now()});
 slip=[];save();toast('Bet placed ✓');tab='bets';render()}
function won(leg,r){const g=r.h+r.a;return leg.pick==='1'?r.h>r.a:leg.pick==='2'?r.a>r.h:leg.pick==='X'?r.h===r.a:leg.pick==='O'?g>2.5:g<2.5}
function settle(){db.matches.forEach(m=>{if(!m.done){m.ko=Math.min(m.ko,Date.now()-DUR);m.end=Date.now()-1}});tick();toast('All open matches finished');render()}

/* ---------- AUTH / DEPOSIT ---------- */
function openAuth(mode){const d=$('#dlg'),reg=mode==='register';
 d.innerHTML=`<h3 style="margin-top:0">${reg?'Create account':'Log in'}</h3>${reg?'<label>Full name</label><input id="n">':''}<label>Email</label><input id="em" type="email">${reg?'<label>Phone</label><input id="ph" type="tel">':''}<label>Password</label><input id="pw" type="password">
 <button class="btn w" id="go">${reg?'Register':'Log in'}</button><p class="mu" style="text-align:center"><a href="#" id="sw">${reg?'Have an account? Log in':'New here? Register'}</a></p>`;d.showModal();
 $('#sw').onclick=ev=>{ev.preventDefault();openAuth(reg?'login':'register')};
 $('#go').onclick=()=>{const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;if(!em||pw.length<4)return toast('Enter email and a password (4+ chars)');
  if(reg){if(db.users.some(u=>u.email===em))return toast('Email already registered');const u={id:Date.now(),name:$('#n').value.trim()||em,email:em,phone:$('#ph').value.trim(),pw,bal:0,at:now()};db.users.push(u);db.uid=u.id}
  else{const u=db.users.find(u=>u.email===em&&u.pw===pw);if(!u)return toast('Wrong email or password');db.uid=u.id}
  save();d.close();render()}}
function deposit(){const u=user(),amt=+$('#amt').value;if(!(amt>=5))return toast('Minimum deposit is GHS 5');
 u.bal=+(u.bal+amt).toFixed(2);db.deposits.unshift({id:'DP-'+Math.random().toString(36).slice(2,8).toUpperCase(),uid:u.id,amt,method:$('#mth').value,at:now()});save();toast('Deposit successful (demo credits)');render()}

/* ---------- USER VIEWS ---------- */
function matchesV(){const n=Date.now(),L=db.matches.filter(m=>!m.done&&m.lg&&(flt==='All'||m.lg===flt)).sort((x,y)=>(n>=x.ko?0:1)-(n>=y.ko?0:1)||x.ko-y.ko);
 return `<div class="chips">${['All',...Object.keys(LEAGUES)].map(l=>`<button class="${flt===l?'on':''}" onclick="flt='${l}';render()">${l}</button>`).join('')}</div>`+L.map(m=>`<div class="card"><div class="m"><div style="display:flex;align-items:center;gap:10px">${crest(m.h)}<div style="flex:1"><b>${e(m.h)}</b> vs <b>${e(m.a)}</b><br><small>${m.lg} · <b class="cd" data-id="${m.id}" style="color:${n>=m.ko?'var(--r)':'var(--g)'}">${cdText(m)}</b></small></div>${crest(m.a)}</div></div>${n<m.ko?`<div class="odds">${['1','X','2'].map(k=>b(m,k)).join('')}</div><div class="odds">${['O','U'].map(k=>b(m,k)).join('')}</div>`:'<div class="mu" style="margin-top:8px">Betting closed – match in play</div>'}</div>`).join('')}
const b=(m,k)=>`<button class="${slip.some(s=>s.mid===m.id&&s.pick===k)?'on':''}" onclick="toggle(${m.id},'${k}')"><span>${LBL[k]}</span>${m.odds[k].toFixed(2)}</button>`;
function slipV(){const u=user();return `<div class="card"><h3 style="margin-top:0">Betslip (${slip.length})</h3>${slip.length?slip.map(s=>`<div class="row"><span>${e(s.name)}<br><small class="mu">${LBL[s.pick]} @ ${s.odds.toFixed(2)}</small></span><a href="#" onclick="toggle(${s.mid},'${s.pick}');return false">✕</a></div>`).join('')+
 `<div class="row"><span class="mu">Total odds</span><b>${totalOdds()}</b></div><label>Stake (GHS)</label><input id="stake" type="number" min="1" value="10" oninput="upd()"><div class="row"><span class="mu">Potential return</span><b id="pr">${money(10*totalOdds())}</b></div><button class="btn w" onclick="placeBet()">${u?'Place bet':'Log in to bet'}</button>`:'<p class="mu">Tap any odds to add a selection. Selections from different matches form a multiple.</p>'}</div>`}
function upd(){$('#pr').textContent=money((+$('#stake').value||0)*totalOdds())}
function betsV(){const u=user();if(!u)return '<div class="card">Log in to see your bets.</div>';const bs=db.bets.filter(x=>x.uid===u.id);
 return bs.length?bs.map(x=>`<div class="card"><div class="row"><b>${x.legs.length>1?'Multiple':'Single'}</b><span class="tag ${x.status}">${x.status.toUpperCase()}</span></div><small class="mu">${x.at} · ${x.id}</small>
 ${x.legs.map(l=>{const m=db.matches.find(m=>m.id===l.mid);return `<div class="row"><span>${LBL[l.pick]} @ ${l.odds.toFixed(2)}<br><small class="mu">${e(l.name)}</small></span><b class="cd" data-id="${l.mid}">${m?cdText(m):''}</b></div>`}).join('')}
 <div class="row"><span class="mu">Stake</span><b>${money(x.stake)}</b></div><div class="row"><span class="mu">Return</span><b>${x.status==='lost'?'0.00':money(x.ret)}</b></div></div>`).join(''):'<div class="card">No bets yet.</div>'}
function depV(){const u=user();if(!u)return '<div class="card">Log in to deposit.</div>';return `<div class="card"><h3 style="margin-top:0">Deposit</h3><p class="mu">Demo only: no real money moves. Credits are added instantly.</p><label>Amount (GHS)</label><input id="amt" type="number" value="50"><label>Method</label><select id="mth"><option>MTN MoMo</option><option>Telecel Cash</option><option>AirtelTigo Money</option><option>Card</option></select><button class="btn w" onclick="deposit()">Deposit</button></div>
 <div class="card"><b>Deposit history</b>${db.deposits.filter(d=>d.uid===u.id).map(d=>`<div class="row"><span>${d.method}<br><small class="mu">${d.at}</small></span><b>${money(d.amt)}</b></div>`).join('')||'<p class="mu">None yet.</p>'}</div>`}

/* ---------- ADMIN ---------- */
const uname=id=>{const u=db.users.find(u=>u.id===id);return u?e(u.email):'—'};
function adminV(){if(!isAdmin())return `<div class="card full" style="max-width:360px;margin:30px auto"><h3 style="margin-top:0">Superbet Admin</h3><label>Username</label><input id="au"><label>Password</label><input id="ap" type="password"><button class="btn w" onclick="if($('#au').value==='admin'&&$('#ap').value==='admin123'){sessionStorage.sbadm='1';render()}else toast('Invalid credentials')">Sign in</button><p class="mu">Demo login: admin / admin123</p></div>`;
 const dep=db.deposits.reduce((a,d)=>a+d.amt,0),st=db.bets.reduce((a,x)=>a+x.stake,0),pay=db.bets.filter(x=>x.status==='won').reduce((a,x)=>a+x.ret,0);
 const T={overview:`<div class="stats"><div class="card"><span class="mu">Registered users</span><h3>${db.users.length}</h3></div><div class="card"><span class="mu">Total deposits</span><h3>${money(dep)}</h3></div><div class="card"><span class="mu">Total stakes</span><h3>${money(st)}</h3></div><div class="card"><span class="mu">Payouts</span><h3>${money(pay)}</h3></div><div class="card"><span class="mu">Net revenue</span><h3>${money(st-pay)}</h3></div></div>
 <div class="card"><b>Latest registrations</b>${tbl(['Name','Email','Joined'],db.users.slice(-5).reverse().map(u=>[e(u.name),e(u.email),u.at]))}</div><div class="card"><b>Latest deposits</b>${tbl(['Ref','User','Amount','Time'],db.deposits.slice(0,5).map(d=>[d.id,uname(d.uid),money(d.amt),d.at]))}</div>`,
 users:`<div class="card">${tbl(['Name','Email','Phone','Balance','Joined'],[...db.users].reverse().map(u=>[e(u.name),e(u.email),e(u.phone||'—'),money(u.bal),u.at]))}</div>`,
 deposits:`<div class="card">${tbl(['Ref','User','Method','Amount','Time'],db.deposits.map(d=>[d.id,uname(d.uid),d.method,money(d.amt),d.at]))}</div>`,
 bets:`<div class="card">${tbl(['Ref','User','Legs','Odds','Stake','Return','Status'],db.bets.map(x=>[x.id,uname(x.uid),x.legs.length,x.odds,money(x.stake),money(x.ret),`<span class="tag ${x.status}">${x.status}</span>`]))}</div>`,
 matches:`<div class="card"><button class="btn" onclick="settle()">Finish all matches now &amp; settle bets</button><p class="mu">Matches now run automatically (about 30 seconds each) and bets settle on their own. Use this to skip ahead.</p>${tbl(['Match','1','X','2','Result'],[...db.matches].reverse().slice(0,20).map(m=>[e(m.h)+' vs '+e(m.a),m.odds['1'],m.odds.X,m.odds['2'],m.done?m.res.h+':'+m.res.a:'Open']))}</div>`};
 return `<div class="full"><div class="row"><h2 style="margin:0">Admin dashboard</h2><button class="btn o" onclick="delete sessionStorage.sbadm;render()">Sign out</button></div><nav style="margin:10px 0;overflow-x:auto">${Object.keys(T).map(k=>`<button class="${adminTab===k?'on':''}" onclick="adminTab='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</nav>${T[adminTab]}</div>`}
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mu">No data yet</td></tr>`}</table></div>`;

/* ---------- RENDER ---------- */

 $('#hd').innerHTML=`<span class="logo" onclick="location.hash='';tab='matches';render()">Super<b>bet</b></span>`+(adm?'<span class="mu">Admin</span><span style="flex:1"></span><a href="#" onclick="location.hash=\'\';render();return false">Back to site</a>':
 `<nav>${[['matches','Matches'],['bets','My Bets'],['results','Results'],['deposit','Deposit']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</nav>`+

const SL=[{t:'Premier League',s:'Bet on every English matchday',f:'Premier League',bg:['#2a0845','#7b2ff7'],c:['#d4145a','#fff'],sk:'#8d5a3b',n:9},{t:'La Liga',s:'Clásicos, derbies and more',f:'La Liga',bg:['#4a0d0d','#e8452c'],c:['#fff','#1d3b8b'],sk:'#e0b08a',n:7},{t:'Serie A',s:'Italy’s finest fixtures',f:'Serie A',bg:['#06284d','#1479d1'],c:['#1479d1','#111'],sk:'#c68863',n:10},{t:'Bundesliga & Ligue 1',s:'Germany and France, best odds',f:'Bundesliga',bg:['#0b3d1e','#18a35a'],c:['#e2231a','#fff'],sk:'#f1c9a5',n:11},{t:'Ghana Premier League',s:'Back the home heroes',f:'Ghana Premier League',bg:['#1b1b1b','#c8102e'],c:['#fcd116','#006b3f'],sk:'#5b3a29',n:10}];

 let k=0;setInterval(()=>{const a=h.querySelectorAll('.sl'),d=h.querySelectorAll('.dots i');a[k].classList.remove('on');d[k].classList.remove('on');k=(k+1)%a.length;a[k].classList.add('on');d[k].classList.add('on')},4000)}
buildHero();addEventListener('hashchange',render);render();tick();setInterval(tick,1000);
